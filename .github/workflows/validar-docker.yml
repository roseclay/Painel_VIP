name: Validar imagem Docker

on:
  push:
    branches: [vitrine-infraestrutura]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t painel-vip:teste .
      - name: Testar contêiner
        run: |
          docker run -d --name painel-vip-teste -p 8080:3000 painel-vip:teste
          for tentativa in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/painel-vip/ | grep -q "Vitrine de infraestrutura de pesquisa"
