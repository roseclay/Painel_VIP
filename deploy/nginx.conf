server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Funciona tanto na raiz quanto atrás do caminho usado pelo Observatório.
  location = /painel-vip {
    return 301 /painel-vip/;
  }

  location ^~ /painel-vip/ {
    rewrite ^/painel-vip/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.json$ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
