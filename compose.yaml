services:
  painel-vip:
    build:
      context: .
    image: painel-vip:latest
    container_name: painel-vip
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      DB_SERVER: ${DB_SERVER:-}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      IMG_BASE: ${IMG_BASE:-https://vip.uesc.br/storage/uesc}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
